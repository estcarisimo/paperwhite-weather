[build-system]
requires = ["uv_build>=0.12.14,<0.13"]
build-backend = "uv_build"

[project]
name = "paperwhite-weather"
version = "0.1.0"
description = "Turn a used Kindle Paperwhite into a quiet, always-on e-ink weather dashboard"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Esteban Carisimo"}]
maintainers = [{name = "Esteban Carisimo"}]
keywords = ["kindle", "e-ink", "eink", "weather", "dashboard", "paperwhite", "raspberry-pi"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
requires-python = ">=3.10"
# Floors are the oldest releases known to work; uv.lock pins what CI actually runs.
dependencies = [
    "astral>=3.2",
    "pillow>=10.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/estcarisimo/paperwhite-weather"
Repository = "https://github.com/estcarisimo/paperwhite-weather"
"Bug Reports" = "https://github.com/estcarisimo/paperwhite-weather/issues"
Changelog = "https://github.com/estcarisimo/paperwhite-weather/blob/main/CHANGELOG.md"

[project.scripts]
paperwhite = "paperwhite_weather.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
ignore = [
    "B008",  # typer.Option(...) defaults are the documented Typer pattern
]

[tool.ruff.lint.isort]
known-first-party = ["paperwhite_weather"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--strict-markers --strict-config"
markers = [
    "math: compared against an independent computation of the same quantity",
    "behaviour: pins current behavior (golden or smoke)",
]

[tool.coverage.run]
source = ["src/paperwhite_weather"]

[tool.coverage.report]
show_missing = true
