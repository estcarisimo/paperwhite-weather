name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: mypy
        run: uv run mypy src/paperwhite_weather

      - name: bandit (static security scan of the package)
        run: uvx bandit -r src/paperwhite_weather -q

      - name: ShellCheck (POSIX shell: Kindle client and Pi installer)
        run: uvx --from shellcheck-py shellcheck -s sh kindle/paperwhite.sh kindle/install.sh kindle/extensions/paperwhite/bin/*.sh deploy/install.sh

      - name: pip-audit (audits the locked dependency set)
        run: |
          uv export --no-emit-project --no-hashes --format requirements.txt -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest tests/ --cov=paperwhite_weather --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: CLI smoke test
        run: uv run paperwhite render --config config.example.yaml --provider mock --output dashboard.png

      - name: Render every skin in both orientations
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run paperwhite gallery --config config.example.yaml --provider mock --output-dir gallery --now 2026-09-18T21:45:00+00:00

      - name: Upload the rendered skins
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: skins-gallery
          path: gallery/

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Build package
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Install the wheel in a clean environment and smoke test
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/paperwhite version
          /tmp/smoke/bin/paperwhite render --config config.example.yaml --provider mock --output /tmp/smoke/dashboard.png

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/
