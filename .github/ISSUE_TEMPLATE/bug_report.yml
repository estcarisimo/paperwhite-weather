name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Minimal `paperwhite` command and the relevant part of your `config.yaml` (remove your coordinates).
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Paperwhite Weather version
      description: Output of `paperwhite version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Python 3.12, Raspberry Pi OS, Kindle Paperwhite 3 on 5.16.2.1.1, skin=minimal"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      render: shell
